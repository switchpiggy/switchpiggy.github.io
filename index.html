<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alan Xiao</title>
  <meta name="description" content="Alan Xiao — site under construction." />
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg:     #fcfcfa;
      --ink:    #1b1b1a;
      --muted:  #6b6b66;
      --accent: #3a4cc4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #15151a;
        --ink:    #e9e9e6;
        --muted:  #9a9a94;
        --accent: #94a2ff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 480px;
      padding: 24px;
      text-align: center;
    }
    .pixel {
      width: 28px;
      height: 28px;
      margin: 0 auto 20px;
      display: block;
      image-rendering: pixelated;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <svg class="pixel" viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" fill="var(--accent)">
      <rect x="3" y="0" width="2" height="2"/><rect x="3" y="6" width="2" height="2"/>
      <rect x="0" y="3" width="2" height="2"/><rect x="6" y="3" width="2" height="2"/>
      <rect x="3" y="3" width="2" height="2"/>
    </svg>
    <h1>Work in progress</h1>
    <p>This site is being rebuilt. Check back soon.</p>
  </main>
</body>
</html>
